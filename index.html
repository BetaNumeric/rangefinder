<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <!-- Lock orientation to portrait on mobile -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="screen-orientation" content="portrait">
  <meta name="orientation" content="portrait">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta http-equiv="ScreenOrientation" content="autoRotate:disabled">
  <link rel="apple-touch-icon" href="assets/images/rangefinder_touch-icon_180.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/images/rangefinder_touch-icon_180.png">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/images/rangefinder_32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/images/rangefinder_16.png">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/images/rangefinder_192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="assets/images/rangefinder_512.png">
  <link rel="manifest" href="manifest.json">
  <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">

  <!-- Title is updated dynamically from APP_VERSION constant in main.js -->
  <title>Rangefinder</title>
  
  <script src="config.js"></script>
  <script src="mapsApi.js"></script>

  <!-- PLEASE NO CHANGES BELOW THIS LINE (UNTIL I SAY SO) -->
  <script language="javascript" type="text/javascript" src="libraries/p5.min.js"></script>
  <script language="javascript" type="text/javascript" src="geoUtils.js"></script>
  <script src="progressStore.js"></script>
  <script language="javascript" type="text/javascript" src="answerScreen.js"></script>
  <script language="javascript" type="text/javascript" src="customLocationsScreen.js"></script>
  <script language="javascript" type="text/javascript" src="dataLoader.js"></script>
  <script language="javascript" type="text/javascript" src="discoveryMapScreen.js"></script>
  <script language="javascript" type="text/javascript" src="dropdownMenu.js"></script>
  <script language="javascript" type="text/javascript" src="gameScreen.js"></script>
  <script language="javascript" type="text/javascript" src="interactiveMap.js"></script>
  <script language="javascript" type="text/javascript" src="mainMenuScreen.js"></script>
  <script language="javascript" type="text/javascript" src="mapSettingsScreen.js"></script>
  <script language="javascript" type="text/javascript" src="orientationService.js"></script>
  <script language="javascript" type="text/javascript" src="permissionScreen.js"></script>
  <script language="javascript" type="text/javascript" src="scoringService.js"></script>
  <script language="javascript" type="text/javascript" src="searchLocationScreen.js"></script>
  <script language="javascript" type="text/javascript" src="settingsScreen.js"></script>
   <script language="javascript" type="text/javascript" src="splashScreen.js"></script>
   <script language="javascript" type="text/javascript" src="main.js"></script>
   <script language="javascript" type="text/javascript" src="a2hs.js"></script>
   <!-- OK, YOU CAN MAKE CHANGES BELOW THIS LINE AGAIN -->

  <style>
    

    :root {
      /* Light theme variables */
      --background-color: rgb(245, 245, 245);
      --text-color: rgb(0, 0, 0);
      --button-bg: rgb(200, 200, 200);
      --button-text: rgb(0, 0, 0);
      --button-locked: rgb(225, 225, 225);
      --button-locked-text: rgb(150, 150, 150);
    }

    :root[data-theme="dark"] {
      /* Dark theme variables */
      --background-color: rgb(33, 33, 33);
      --text-color: rgb(255, 255, 255);
      --button-bg: rgb(100, 100, 100);
      --button-text: rgb(255, 255, 255);
      --button-locked: rgb(50, 50, 50);
      --button-locked-text: rgb(150, 150, 150);
    }

    body {
      padding: 0;
      margin: 0;
      overscroll-behavior: none;
      background-color: var(--background-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      -webkit-transform: translateZ(0);
      -moz-transform: translateZ(0);
      -ms-transform: translateZ(0);
      -o-transform: translateZ(0);
      transform: translateZ(0);
      overflow: hidden;
      touch-action: none;
      position: fixed;
      width: 100%;
      height: 100%;
      user-select: none;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      -webkit-touch-callout: none;
    }
    canvas {
      pointer-events: none;
      position: relative;
      z-index: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    .settings-panel {
      position: fixed;
      top: 0;
      z-index: 2000;
      display: flex;
      flex-direction: column;
      background: var(--background-color);
      color: var(--text-color);
      font-family: Helvetica, Arial, sans-serif;
    }
    .settings-header {
      display: grid;
      grid-template-columns: 44px 1fr 44px;
      align-items: center;
      padding: 16px;
      flex-shrink: 0;
    }
    .settings-header h1 { margin: 0; text-align: center; font-size: 32px; }
    .settings-back, .settings-action {
      border: none;
      border-radius: 10px;
      background: var(--button-bg);
      color: var(--button-text);
      font: inherit;
      font-size: 20px;
      min-height: 48px;
      cursor: pointer;
    }
    .settings-back { font-size: 30px; }
    .settings-controls {
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      touch-action: pan-y pinch-zoom;
      -webkit-overflow-scrolling: touch;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      padding: 16px 24px calc(24px + env(safe-area-inset-bottom));
    }
    .settings-controls > * { flex-shrink: 0; }
    .settings-action { width: min(100%, 300px); padding: 10px; box-sizing: border-box; }
    .settings-status { max-width: 300px; margin: 0; line-height: 1.4; }
    .settings-action:focus-visible, .settings-back:focus-visible {
      outline: 3px solid var(--text-color);
      outline-offset: 3px;
    }

    /* Add after your existing styles */
    #map {
      position: absolute;
      z-index: 1;
      background: white;
      pointer-events: auto !important;
      touch-action: manipulation !important;
      user-select: none;
      width: 100% !important;
      height: 100% !important;
      /* iOS fixes */
      transform: translate3d(0,0,0);
      -webkit-transform: translate3d(0,0,0);
      -webkit-overflow-scrolling: touch;
      overflow: hidden;
    }

    /* Add iOS-specific wrapper */
    .map-container {
      position: absolute;
      width: 100%;
      height: 100%;
      overflow: hidden;
      /* iOS fixes */
      transform: translate3d(0,0,0);
      -webkit-transform: translate3d(0,0,0);
      -webkit-overflow-scrolling: touch;
    }

     /* Add to Home Screen Banner - styles applied via JavaScript */
     #a2hs-banner {
       display: none;
     }

    /* iOS Install Instructions Overlay */
    #ios-install-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.85);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      padding: 20px;
    }
    
    .ios-install-content {
      background: var(--background-color);
      color: var(--text-color);
      border-radius: 12px;
      padding: 24px;
      max-width: 400px;
      width: 100%;
      text-align: center;
      font-family: Helvetica, Arial, sans-serif;
    }
    
    .ios-install-content h2 {
      margin: 0 0 16px 0;
      font-size: 20px;
    }
    
    .ios-install-content ol {
      text-align: left;
      padding-left: 20px;
      margin: 16px 0;
      font-size: 14px;
      line-height: 1.6;
    }
    
    .ios-install-content li {
      margin-bottom: 8px;
    }
    
    #ios-close-btn {
      background: var(--button-bg);
      color: var(--text-color);
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 16px;
      font-family: Helvetica, Arial, sans-serif;
    }
    
  </style>
</head>
<body>
  <main>
    <!-- Add your game screens here as sections or divs -->
  </main>
  
  <!-- Add to Home Screen Banner -->
  <div id="a2hs-banner">
    <span id="a2hs-text"></span>
    <button id="a2hs-install-btn" style="display: none;">Install</button>
    <button id="a2hs-close-btn">×</button>
  </div>
  
  <!-- iOS Install Instructions Overlay -->
  <div id="ios-install-overlay">
    <div class="ios-install-content">
      <h2>Install Rangefinder</h2>
      <ol>
        <li>Tap the <strong>Share</strong> button <span style="font-size: 18px;">⎋</span> at the bottom of Safari</li>
        <li>Scroll down and tap <strong>"Add to Home Screen"</strong></li>
        <li>Tap <strong>"Add"</strong> in the top right</li>
      </ol>
      <p style="font-size: 13px; color: var(--button-locked-text); margin: 8px 0;">The app will appear on your home screen like a native app!</p>
      <button id="ios-close-btn">Got it!</button>
    </div>
  </div>
  
  
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js')
        .then((registration) => {
          console.log('Service Worker registered');
        })
        .catch((error) => {
          console.error('Service Worker registration failed:', error);
        });
    }
  </script>
  
</body>
</html>
